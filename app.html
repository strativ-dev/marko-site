<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marko — Projects</title>
  <link rel="icon" href="marko-128.png?v=1.4.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #2f6ae8; --blue-deep: #1e3fd8; --blue-wash: #eaf1fe;
      --ink: #0b0b0f; --text: #16181d; --sub: #4a4f5c; --muted: #7a8090;
      --line: #ececf1; --card: #f4f5f8; --white: #fff;
      --sev-neutral: #2f6ae8; --sev-low: #22c55e; --sev-medium: #eab308;
      --sev-high: #f97316; --sev-critical: #e5484d;
      --sidebar: #10141d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 14px/1.5 "Inter", -apple-system, sans-serif; color: var(--text);
      background: var(--white); height: 100vh; display: flex; overflow: hidden;
    }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    input, select { font: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ── sidebar ── */
    aside {
      width: 264px; flex-shrink: 0; background: var(--sidebar); color: #dfe3ee;
      display: flex; flex-direction: column; padding: 18px 14px;
    }
    .sb-brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 16px; }
    .sb-brand .chip {
      width: 30px; height: 30px; border-radius: 8px; background: var(--blue);
      color: #fff; font-family: "Arial Black", Impact, sans-serif; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
    }
    .sb-brand b { font-size: 16px; color: #fff; }
    .sb-create {
      background: var(--blue); color: #fff; border-radius: 10px;
      padding: 11px 14px; font-weight: 600; text-align: center; margin-bottom: 12px;
      transition: background .12s;
    }
    .sb-create:hover { background: var(--blue-deep); }
    .sb-mentions {
      display: flex; align-items: center; gap: 9px; width: 100%;
      padding: 9px 12px; margin-bottom: 12px; border-radius: 9px;
      color: #c3c8d6; font-size: 13.5px; text-align: left;
    }
    .sb-mentions:hover { background: rgba(255,255,255,.06); color: #fff; }
    .sb-mentions.active { background: rgba(47,106,232,.25); color: #fff; }
    .sb-mentions svg { width: 16px; height: 16px; flex-shrink: 0; }
    .sb-mentions span:not(.cnt) { flex: 1; }
    .sb-mentions .cnt {
      background: var(--blue); color: #fff; font-size: 11px; font-weight: 700;
      border-radius: 999px; padding: 1px 7px;
    }
    .mention-list { display: flex; flex-direction: column; gap: 8px; padding: 20px 24px; overflow-y: auto; }
    .mention-item {
      display: flex; gap: 12px; padding: 14px 16px; border: 1px solid var(--line);
      border-radius: 12px; text-align: left; width: 100%; background: #fff;
    }
    .mention-item:hover { border-color: #cdd9f6; background: #f7faff; }
    .mention-item.unread { border-left: 3px solid var(--blue); background: #f7faff; }
    .mention-item .av {
      width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: #fff;
      font-size: 12px; font-weight: 700; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .mention-item .body { flex: 1; min-width: 0; }
    .mention-item .who { font-size: 13.5px; margin-bottom: 3px; }
    .mention-item .who b { font-weight: 600; }
    .mention-item .who span { color: var(--muted); }
    .mention-item .txt { font-size: 13.5px; color: var(--sub); margin-bottom: 5px; }
    .mention-item .when { font-size: 11.5px; color: var(--muted); }
    .sb-search { position: relative; margin-bottom: 14px; }
    .sb-search input {
      width: 100%; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
      border-radius: 9px; padding: 9px 12px; color: #fff; outline: 0;
    }
    .sb-search input::placeholder { color: #8a90a3; }
    .sb-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .sb-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px;
      border-radius: 9px; color: #c3c8d6; text-align: left; width: 100%;
    }
    .sb-item:hover { background: rgba(255,255,255,.06); }
    .sb-item.active { background: rgba(47,106,232,.25); color: #fff; }
    .sb-item .dot {
      width: 26px; height: 26px; border-radius: 7px; background: rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; color: #fff; flex-shrink: 0;
    }
    .sb-item .meta { min-width: 0; }
    .sb-item .meta b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-item .meta span { font-size: 11.5px; color: #8a90a3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .sb-item .cnt { margin-left: auto; font-size: 11px; background: rgba(255,255,255,.12); border-radius: 99px; padding: 2px 8px; }
    .sb-foot { border-top: 1px solid rgba(255,255,255,.1); padding-top: 12px; margin-top: 12px; position: relative; }
    .sb-account { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px; border-radius: 9px; }
    .sb-account:hover { background: rgba(255,255,255,.06); }
    .sb-account .av {
      width: 30px; height: 30px; border-radius: 50%; background: var(--blue);
      color: #fff; font-weight: 700; font-size: 13px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sb-account .who { min-width: 0; text-align: left; }
    .sb-account .who b { display: block; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-account .who span { font-size: 11px; color: #8a90a3; }
    .acct-menu {
      position: absolute; bottom: 54px; left: 6px; right: 6px;
      background: #1b2130; border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
      padding: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.5); z-index: 20;
    }
    .acct-menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; font-size: 13px; color: #dfe3ee; }
    .acct-menu button:hover { background: rgba(255,255,255,.07); }
    .acct-menu .danger { color: #ff8589; }
    .acct-menu hr { border: 0; border-top: 1px solid rgba(255,255,255,.1); margin: 6px 0; }
    .acct-ws { display: flex; align-items: center; gap: 9px; padding: 8px 12px; font-size: 13px; color: #fff; }
    .acct-ws .av {
      width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff;
      font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .acct-ws span:not(.av) { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* profile view */
    .prof-tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--line); }
    .prof-tab { padding: 12px 14px; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .prof-tab.on { color: var(--blue); border-color: var(--blue); }
    .prof-body { flex: 1; overflow-y: auto; padding: 24px; background: #f6f7fa; }
    .prof-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; max-width: 620px; padding: 20px 22px; }
    .prof-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .prof-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .prof-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0; border-top: 1px solid var(--line); font-size: 14px;
    }
    .prof-row:first-of-type { border-top: 0; }
    .prof-row span { flex: 1; }
    .prof-head { display: flex; font-size: 11px; font-weight: 700; letter-spacing: .6px; color: var(--muted); text-transform: uppercase; }
    .prof-head span { flex: 1; }
    .sw { position: relative; width: 44px; height: 25px; flex-shrink: 0; }
    .sw input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .sw i {
      position: absolute; inset: 0; border-radius: 999px; background: #ccd2de;
      transition: background .15s; pointer-events: none;
    }
    .sw i::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px;
      border-radius: 50%; background: #fff; transition: transform .15s;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .sw input:checked + i { background: #17b26a; }
    .sw input:checked + i::after { transform: translateX(19px); }
    .prof-field { display: block; margin-bottom: 14px; }
    .prof-field span { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 5px; font-weight: 500; }
    .prof-field input { width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; outline: 0; }

    /* ── main ── */
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 24px; border-bottom: 1px solid var(--line);
    }
    .topbar .title { min-width: 0; }
    .topbar h1 { font-size: 19px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .url { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .spacer { flex: 1; }
    .btn {
      border-radius: 9px; padding: 9px 16px; font-weight: 600; font-size: 13.5px;
      display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    }
    .btn.blue { background: var(--blue); color: #fff; }
    .btn.blue:hover { background: var(--blue-deep); }
    .btn.ghost { border: 1px solid var(--line); color: var(--sub); background: #fff; }
    .btn.ghost:hover { border-color: #d6d9e0; color: var(--text); }
    .people { display: flex; align-items: center; gap: 4px; margin-right: 4px; }
    .person {
      position: relative; padding: 2px 4px 8px; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center;
    }
    .person:hover { background: var(--card); }
    .person.on { background: var(--blue-wash); }
    .person .p-av {
      width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff;
      font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .person.on .p-av { box-shadow: 0 0 0 2px var(--blue), 0 0 0 4px #fff inset; }
    .person .p-n {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      background: #fff; border: 1px solid var(--line); border-radius: 999px;
      font-size: 10px; font-weight: 700; line-height: 1; padding: 2px 5px; color: var(--sub);
    }
    .person.on .p-n { border-color: var(--blue); color: var(--blue); }

    .author-banner {
      display: flex; align-items: center; gap: 12px;
      margin: 12px 24px 0; padding: 10px 14px;
      background: var(--ink); color: #fff; border-radius: 10px; font-size: 13.5px;
    }
    .author-banner[hidden] { display: none; }
    .author-banner span { flex: 1; }
    .ab-btn {
      background: rgba(255,255,255,.16); color: #fff; border-radius: 7px;
      padding: 5px 12px; font-size: 12.5px; font-weight: 600;
    }
    .ab-btn:hover { background: rgba(255,255,255,.26); }
    .ab-link { color: #7cb8f8; font-size: 12.5px; font-weight: 600; }

    .kebab { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: var(--muted); border: 1px solid var(--line); }
    .kebab:hover { background: var(--card); }

    .filters {
      display: flex; align-items: center; gap: 10px; padding: 14px 24px 10px; flex-wrap: wrap;
    }
    .filters input[type="search"] {
      border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; width: 200px; outline: 0;
    }
    .filters input[type="search"]:focus { border-color: var(--blue); }
    .filters select {
      border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px;
      background: #fff; color: var(--sub); outline: 0;
    }

    .board {
      flex: 1; overflow-x: auto; overflow-y: hidden;
      display: flex; gap: 14px; padding: 10px 24px 24px; align-items: stretch;
    }
    .col {
      width: 250px; flex-shrink: 0; background: var(--card); border-radius: 14px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .col .col-bar { height: 4px; }
    .col header { padding: 12px 14px 8px; font-weight: 700; font-size: 13.5px; }
    .col .cards { flex: 1; overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
    .hcard {
      background: #fff; border-radius: 11px; padding: 12px 12px 10px;
      box-shadow: 0 1px 3px rgba(10,14,30,.07); cursor: grab;
      border: 1px solid transparent;
    }
    .hcard:hover { border-color: #d9e3fb; }
    .hcard.dragging { opacity: .45; cursor: grabbing; }
    .col.dragover { outline: 2px dashed var(--blue); outline-offset: -4px; background: var(--blue-wash); }
    .hcard .txt { font-size: 13px; color: var(--text); margin-bottom: 10px; word-wrap: break-word; }
    .hcard .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; }
    .hcard .n { background: var(--card); border-radius: 6px; padding: 1px 7px; font-weight: 600; }
    .hcard .av {
      width: 20px; height: 20px; border-radius: 50%; background: var(--blue); color: #fff;
      font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    }
    .hcard .done { margin-left: auto; }
    .hcard input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; }
    .col .add { padding: 10px 14px; color: var(--muted); font-size: 13px; text-align: left; }
    .col .add:hover { color: var(--blue); }

    /* ── empty / loading states ── */
    .state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: var(--muted); padding: 40px; text-align: center;
    }
    .state .big { font-size: 17px; font-weight: 700; color: var(--text); }

    /* ── export document ── */
    .export-doc { flex: 1; overflow-y: auto; padding: 40px 56px 80px; max-width: 1100px; }
    .ex-title { font-size: 30px; font-weight: 800; letter-spacing: -.6px; }
    .ex-host { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .ex-rule { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
    .ex-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 26px; margin-bottom: 40px; }
    .ex-label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin: 12px 0 5px; }
    .ex-line { font-size: 13.5px; color: var(--sub); margin-bottom: 3px; word-break: break-word; }
    .ex-code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
    .ex-person { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
    .ex-person .av, .av.sm {
      width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff;
      font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    }
    .ex-sev { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--sub); text-transform: capitalize; }
    .ex-sev i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .ex-item {
      display: grid; grid-template-columns: 1fr 1.2fr; gap: 32px;
      padding: 28px 0; border-top: 1px solid var(--line);
      break-inside: avoid; page-break-inside: avoid;
    }
    .ex-item-head { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 4px; }
    .ex-num {
      width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff;
      font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    }
    .ex-item-shot img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
    .ex-noshot {
      border: 1px dashed var(--line); border-radius: 8px; padding: 40px;
      text-align: center; color: var(--muted); font-size: 13px;
    }
    .chk { display: flex; align-items: center; gap: 9px; font-size: 13.5px; margin-bottom: 9px; cursor: pointer; }
    .chk input { width: 16px; height: 16px; accent-color: var(--blue); }

    @media print {
      aside, .topbar, .no-print, .overlay, .drawer { display: none !important; }
      body { display: block; height: auto; overflow: visible; }
      main { display: block; }
      .export-doc { overflow: visible; padding: 0; max-width: none; }
      .ex-item { grid-template-columns: 1fr 1fr; }
    }

    /* ── modal ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(9,12,20,.55); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      backdrop-filter: blur(6px);
    }
    .modal {
      width: min(440px, 100%); background: #fff; border-radius: 18px; padding: 24px;
      box-shadow: 0 30px 70px rgba(10,14,30,.35);
    }
    .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .modal label { display: block; margin-bottom: 12px; }
    .modal label span { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 5px; font-weight: 500; }
    .modal input, .modal textarea, .modal select {
      width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; outline: 0;
    }
    .modal input:focus, .modal textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47,106,232,.15); }
    .modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
    .modal .status { font-size: 13px; min-height: 18px; margin-top: 10px; color: var(--muted); }
    .modal .status.err { color: #e5484d; }
    .modal .status.ok { color: #16a34a; }

    /* ── comment detail drawer ── */
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 92vw);
      background: #fff; box-shadow: -18px 0 50px rgba(10,14,30,.18); z-index: 90;
      display: flex; flex-direction: column;
    }
    .drawer header {
      padding: 16px 20px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
    }
    .drawer header .sev { width: 10px; height: 10px; border-radius: 50%; }
    .drawer header b { font-size: 14px; flex: 1; }
    .drawer .body { flex: 1; overflow-y: auto; padding: 18px 20px; }
    .drawer .first { font-size: 14px; margin-bottom: 6px; }
    .drawer .whenwho { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    .d-shot {
      display: block; width: 100%; border-radius: 10px; border: 1px solid var(--line);
      margin-bottom: 16px; background: var(--card);
    }
    .drawer .props { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .drawer .props label span { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
    .drawer .props select, .drawer .props input {
      width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; outline: 0; background: #fff;
    }
    .cmt { display: flex; gap: 10px; margin-bottom: 14px; }
    .cmt .av { width: 28px; height: 28px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cmt .bubble { background: var(--card); border-radius: 10px; padding: 8px 12px; font-size: 13px; flex: 1; }
    .cmt .bubble .by { font-weight: 600; font-size: 12px; margin-bottom: 2px; }
    .cmt .bubble .at { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .drawer footer { border-top: 1px solid var(--line); padding: 14px 20px; display: flex; gap: 10px; }
    .drawer footer input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; outline: 0; }
    .drawer footer input:focus { border-color: var(--blue); }

    .menu {
      position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 18px 50px rgba(10,14,30,.18); padding: 6px; z-index: 110; min-width: 200px;
    }
    .menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; }
    .menu button:hover { background: var(--card); }
    .menu .danger { color: #e5484d; }
    .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

    @media (max-width: 760px) {
      aside { display: none; }
    }
  </style>
</head>
<body>

<aside>
  <div class="sb-brand"><div class="chip">M</div><b>marko</b></div>
  <button class="sb-create" id="btn-create">+ Create project</button>
  <button class="sb-mentions" id="btn-mentions">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" /><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.9 7.9" />
    </svg>
    <span>Mentions</span>
    <span class="cnt" id="mentions-badge" hidden></span>
  </button>
  <div class="sb-search"><input id="sb-search" placeholder="Search" /></div>
  <div class="sb-list" id="sb-list"></div>
  <div class="sb-foot">
    <div class="acct-menu" id="acct-menu" hidden>
      <div class="acct-ws"><span class="av" id="ws-av">?</span><span id="ws-name">workspace</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#4da3f7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <hr />
      <button id="mi-settings">Settings</button>
      <button id="mi-password">Change password</button>
      <hr />
      <button id="mi-install">Install extension</button>
      <button id="mi-landing">Open landing page</button>
      <hr />
      <button class="danger" id="mi-logout">Sign out</button>
    </div>
    <button class="sb-account" id="btn-account">
      <span class="av" id="acct-av">?</span>
      <span class="who"><b id="acct-name">…</b><span id="acct-email"></span></span>
    </button>
  </div>
</aside>

<main id="main">
  <div class="state" id="loading"><div class="big">Loading…</div></div>
</main>

<script>
"use strict";
const BACKEND = "https://marko-share.strativ.workers.dev";
const LS_KEY = "marko:web:session";
const SEVERITIES = [
  { id: "neutral",  label: "Neutral",  color: "var(--sev-neutral)" },
  { id: "low",      label: "Low",      color: "var(--sev-low)" },
  { id: "medium",   label: "Medium",   color: "var(--sev-medium)" },
  { id: "high",     label: "High",     color: "var(--sev-high)" },
  { id: "critical", label: "Critical", color: "var(--sev-critical)" },
];

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = (s) => (String(s || "?").trim()[0] || "?").toUpperCase();
const fmtDate = (t) => t ? new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";

let session = null;   // { token, exp, email, name }
let projects = [];
let current = null;   // { project, pins }
let filters = { q: "", status: "active", assignee: "", author: "", severityView: true };
let drawerPin = null;

function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (s && s.token && (s.exp || 0) > Date.now() + 30_000) return s;
  } catch {}
  return null;
}
function logout() {
  localStorage.removeItem(LS_KEY);
  location.href = "index.html#sign-in";
}

async function api(path, opts = {}) {
  const res = await fetch(BACKEND + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + session.token,
      ...(opts.headers || {}),
    },
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401) { logout(); throw new Error("unauthorized"); }
  if (!res.ok) {
    const err = new Error(data.error || ("http_" + res.status));
    err.data = data;
    throw err;
  }
  return data;
}

/* ── sidebar ── */
function renderSidebar() {
  $("#acct-av").textContent = initials(session.name || session.email);
  const wsAv = $("#ws-av"), wsName = $("#ws-name");
  if (wsAv) wsAv.textContent = initials(session.name || session.email);
  if (wsName) wsName.textContent = (session.name || session.email.split("@")[0]) + "'s workspace";
  $("#acct-name").textContent = session.name || session.email.split("@")[0];
  $("#acct-email").textContent = session.email;
  const q = ($("#sb-search").value || "").toLowerCase();
  const pid = currentPid();
  $("#sb-list").innerHTML = projects
    .filter((p) => !q || p.name.toLowerCase().includes(q) || (p.url || "").toLowerCase().includes(q))
    .map((p) => {
      let host = "";
      try { host = new URL(p.url).host; } catch {}
      const active = p.counts ? p.counts.active : 0;
      return `<button class="sb-item ${p.id === pid ? "active" : ""}" data-pid="${p.id}">
        <span class="dot">${esc(initials(p.name))}</span>
        <span class="meta"><b>${esc(p.name)}</b><span>${esc(host)}</span></span>
        ${active ? `<span class="cnt">${active}</span>` : ""}
      </button>`;
    }).join("") || `<p style="color:#8a90a3;font-size:12.5px;padding:8px 10px">No projects yet.</p>`;
  document.querySelectorAll(".sb-item").forEach((el) =>
    el.addEventListener("click", () => { location.hash = "#/p/" + el.dataset.pid; })
  );
}

function currentPid() {
  const m = location.hash.match(/^#\/p\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

/* ── main views ── */
function severityOf(h) { return SEVERITIES.some((s) => s.id === h.severity) ? h.severity : "neutral"; }

function renderEmptyHome() {
  $("#main").innerHTML = `<div class="state">
    <div class="big">${projects.length ? "Pick a project" : "Create your first project"}</div>
    <p>${projects.length ? "Select a project from the sidebar to see its comments." : "A project collects every comment your team pins on a site."}</p>
    <button class="btn blue" id="empty-create">+ Create project</button>
  </div>`;
  $("#empty-create").addEventListener("click", openCreateModal);
}

function syncAuthorBanner() {
  const bar = $("#author-banner");
  if (!bar) return;
  if (!filters.author) { bar.hidden = true; return; }
  bar.hidden = false;
  $("#author-banner-text").textContent =
    `Filtered to ${filters.author.split("@")[0]}'s comments.`;
  $("#ab-showall").onclick = () => { filters.author = ""; renderProject(); };
  $("#ab-hide").onclick = () => { bar.hidden = true; };
}

// Non-blocking notice; replaces window.alert so nothing blocks the page.
function alertBanner(msg) {
  const bar = $("#author-banner");
  if (!bar) return;
  bar.hidden = false;
  $("#author-banner-text").textContent = msg;
  $("#ab-showall").style.display = "none";
  $("#ab-hide").onclick = () => { bar.hidden = true; $("#ab-showall").style.display = ""; };
}

function applyFilters(pins) {
  return pins.filter((h) => {
    if (filters.author && h.createdBy !== filters.author) return false;
    if (filters.status === "active" && h.status === "resolved") return false;
    if (filters.status === "resolved" && h.status !== "resolved") return false;
    if (filters.assignee && (h.assignee || "") !== filters.assignee) return false;
    if (filters.q) {
      const q = filters.q.toLowerCase();
      const inComment = (h.comment || "").toLowerCase().includes(q);
      const inThread = (h.comments || []).some((c) => (c.text || "").toLowerCase().includes(q));
      if (!inComment && !inThread) return false;
    }
    return true;
  });
}

function renderProject() {
  const { project, pins } = current;
  const assignees = [...new Set(pins.map((h) => h.assignee).filter(Boolean))];
  let host = ""; try { host = new URL(project.url).host; } catch {}

  // One avatar per member, badged with how many comments they authored.
  const roster = [project.owner, ...(project.members || [])].filter(Boolean);
  const authored = (who) => pins.filter((h) => h.createdBy === who).length;

  $("#main").innerHTML = `
    <div class="topbar">
      <div class="title">
        <h1>${esc(project.name)}</h1>
        <div class="url">${esc(host || project.url || "")}</div>
      </div>
      <div class="spacer"></div>
      <div class="people" id="people">
        ${roster.map((m) => `
          <button class="person ${filters.author === m ? "on" : ""}" data-who="${esc(m)}"
                  title="${esc(m)} &mdash; ${authored(m)} comment${authored(m) === 1 ? "" : "s"}">
            <span class="p-av">${esc(initials(m))}</span>
            <span class="p-n">${authored(m)}</span>
          </button>`).join("")}
      </div>
      <button class="btn blue" id="btn-share">Share</button>
      <button class="btn ghost" id="btn-add">+ Add a comment</button>
      <button class="kebab" id="btn-kebab" aria-label="Project menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>
    <div class="author-banner" id="author-banner" hidden>
      <span id="author-banner-text"></span>
      <button class="ab-btn" id="ab-showall">Show all</button>
      <button class="ab-link" id="ab-hide">Hide</button>
    </div>
    <div class="filters">
      <input type="search" id="f-q" placeholder="Search" value="${esc(filters.q)}" />
      <select id="f-status">
        <option value="active" ${filters.status === "active" ? "selected" : ""}>Active</option>
        <option value="resolved" ${filters.status === "resolved" ? "selected" : ""}>Resolved</option>
        <option value="all" ${filters.status === "all" ? "selected" : ""}>All</option>
      </select>
      <select id="f-assignee">
        <option value="">Assigned to</option>
        ${assignees.map((a) => `<option ${filters.assignee === a ? "selected" : ""} value="${esc(a)}">${esc(a)}</option>`).join("")}
      </select>
    </div>
    <div class="board" id="board"></div>`;

  $("#f-q").addEventListener("input", (e) => { filters.q = e.target.value; renderBoard(); });
  $("#f-status").addEventListener("change", (e) => { filters.status = e.target.value; renderBoard(); });
  $("#f-assignee").addEventListener("change", (e) => { filters.assignee = e.target.value; renderBoard(); });
  $("#btn-share").addEventListener("click", openShareModal);
  $("#btn-kebab").addEventListener("click", openKebab);
  $("#btn-add").addEventListener("click", () => {
    // Open the site itself; the extension mounts in comment mode there.
    const target = project.url || "";
    if (!target) { alertBanner("This project has no site URL yet. Add one in Project details."); return; }
    window.open(/^https?:/.test(target) ? target : "https://" + target, "_blank", "noopener");
  });
  document.querySelectorAll(".person").forEach((el) =>
    el.addEventListener("click", () => {
      const who = el.dataset.who;
      filters.author = filters.author === who ? "" : who;
      renderProject();
    })
  );
  syncAuthorBanner();

  renderBoard();
}

function renderBoard() {
  const filtered = applyFilters(current.pins);
  $("#board").innerHTML = SEVERITIES.map((sev) => {
    const items = filtered.filter((h) => severityOf(h) === sev.id);
    return `<div class="col" data-sev="${sev.id}">
      <div class="col-bar" style="background:${sev.color}"></div>
      <header>${sev.label} (${items.length})</header>
      <div class="cards">
        ${items.map((h) => `
          <div class="hcard" draggable="true" data-hid="${h.id}">
            <div class="txt">${esc(h.comment)}</div>
            <div class="meta">
              <span class="n">${1 + (h.comments || []).length}</span>
              <span class="av" title="${esc(h.createdBy)}">${esc(initials(h.createdBy))}</span>
              ${h.assignee ? `<span title="assignee">→ ${esc(h.assignee.split("@")[0])}</span>` : ""}
              ${h.due ? `<span>${fmtDate(h.due)}</span>` : ""}
              <span class="done"><input type="checkbox" ${h.status === "resolved" ? "checked" : ""} data-resolve="${h.id}" title="Resolve" /></span>
            </div>
          </div>`).join("")}
      </div>
    </div>`;
  }).join("");

  document.querySelectorAll(".hcard").forEach((el) =>
    el.addEventListener("click", (e) => {
      if (e.target.matches("input[type=checkbox]")) return;
      openDrawer(el.dataset.hid);
    })
  );
  document.querySelectorAll("input[data-resolve]").forEach((el) =>
    el.addEventListener("change", async () => {
      const hid = el.dataset.resolve;
      const status = el.checked ? "resolved" : "active";
      const h = current.pins.find((x) => x.id === hid);
      if (h) h.status = status;
      renderBoard();
      try { await api(`/projects/${current.project.id}/pins/${hid}`, { method: "PATCH", body: JSON.stringify({ status }) }); }
      catch { if (h) h.status = status === "resolved" ? "active" : "resolved"; renderBoard(); }
    })
  );

  // drag a card to another severity column
  document.querySelectorAll(".hcard").forEach((el) => {
    el.addEventListener("dragstart", (e) => {
      el.classList.add("dragging");
      e.dataTransfer.setData("text/plain", el.dataset.hid);
      e.dataTransfer.effectAllowed = "move";
    });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
  });
  document.querySelectorAll(".col").forEach((col) => {
    col.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      col.classList.add("dragover");
    });
    col.addEventListener("dragleave", (e) => {
      if (!col.contains(e.relatedTarget)) col.classList.remove("dragover");
    });
    col.addEventListener("drop", async (e) => {
      e.preventDefault();
      col.classList.remove("dragover");
      const hid = e.dataTransfer.getData("text/plain");
      const severity = col.dataset.sev;
      const h = current.pins.find((x) => x.id === hid);
      if (!h || !severity || severityOf(h) === severity) return;
      const prev = h.severity;
      h.severity = severity;
      renderBoard();
      try { await api(`/projects/${current.project.id}/pins/${hid}`, { method: "PATCH", body: JSON.stringify({ severity }) }); }
      catch { h.severity = prev; renderBoard(); }
    });
  });
}

/* ── pin drawer ── */
function openDrawer(hid) {
  const h = current.pins.find((x) => x.id === hid);
  if (!h) return;
  drawerPin = h;
  closeDrawer();
  const sev = SEVERITIES.find((s) => s.id === severityOf(h));
  const el = document.createElement("div");
  el.className = "drawer";
  el.id = "drawer";
  el.innerHTML = `
    <header>
      <span class="sev" style="background:${sev.color}"></span>
      <b>Pin</b>
      <button class="kebab" id="drawer-close" aria-label="Close">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="body">
      <p class="first">${esc(h.comment)}</p>
      <p class="whenwho">${esc(h.createdBy)} · ${new Date(h.createdAt).toLocaleString()}${h.pageUrl ? ` · <a href="${esc(h.pageUrl)}" target="_blank" rel="noopener" style="color:var(--blue)">open page</a>` : ""}</p>
      ${h.hasShot ? `<img class="d-shot" id="d-shot" alt="Screenshot of the pinned element" />` : ""}
      <div class="props">
        <label><span>Severity</span>
          <select id="d-severity">${SEVERITIES.map((s) => `<option value="${s.id}" ${s.id === severityOf(h) ? "selected" : ""}>${s.label}</option>`).join("")}</select>
        </label>
        <label><span>Status</span>
          <select id="d-status"><option value="active" ${h.status !== "resolved" ? "selected" : ""}>Active</option><option value="resolved" ${h.status === "resolved" ? "selected" : ""}>Resolved</option></select>
        </label>
        <label><span>Assignee</span><input id="d-assignee" value="${esc(h.assignee || "")}" placeholder="email or name" /></label>
        <label><span>Due</span><input id="d-due" type="date" value="${h.due ? new Date(h.due).toISOString().slice(0, 10) : ""}" /></label>
      </div>
      <div id="d-comments">${(h.comments || []).map(renderComment).join("")}</div>
    </div>
    <footer>
      <input id="d-new-comment" placeholder="Add a comment…" />
      <button class="btn blue" id="d-send">Send</button>
    </footer>`;
  document.body.appendChild(el);

  $("#drawer-close").addEventListener("click", closeDrawer);
  const shotEl = $("#d-shot");
  if (shotEl) {
    api(`/projects/${current.project.id}/pins/${h.id}/shot`)
      .then((d) => { if (d.shot) shotEl.src = d.shot; else shotEl.remove(); })
      .catch(() => shotEl.remove());
  }
  const patch = async (body) => {
    Object.assign(h, body);
    renderBoard();
    try { await api(`/projects/${current.project.id}/pins/${h.id}`, { method: "PATCH", body: JSON.stringify(body) }); } catch {}
  };
  $("#d-severity").addEventListener("change", (e) => patch({ severity: e.target.value }));
  $("#d-status").addEventListener("change", (e) => patch({ status: e.target.value }));
  $("#d-assignee").addEventListener("change", (e) => patch({ assignee: e.target.value.trim() }));
  $("#d-due").addEventListener("change", (e) => patch({ due: e.target.value ? new Date(e.target.value).getTime() : null }));
  const send = async () => {
    const text = $("#d-new-comment").value.trim();
    if (!text) return;
    $("#d-new-comment").value = "";
    try {
      const { comment } = await api(`/projects/${current.project.id}/pins/${h.id}/comments`, { method: "POST", body: JSON.stringify({ text }) });
      h.comments = h.comments || [];
      h.comments.push(comment);
      $("#d-comments").insertAdjacentHTML("beforeend", renderComment(comment));
      renderBoard();
    } catch {}
  };
  $("#d-send").addEventListener("click", send);
  $("#d-new-comment").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
}
function renderComment(c) {
  return `<div class="cmt">
    <span class="av">${esc(initials(c.byName || c.by))}</span>
    <div class="bubble"><div class="by">${esc(c.byName || c.by)}</div>${esc(c.text)}<div class="at">${new Date(c.at).toLocaleString()}</div></div>
  </div>`;
}
function closeDrawer() { const d = $("#drawer"); if (d) d.remove(); }

/* ── modals ── */
function modal(html) {
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.addEventListener("click", (e) => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}

function openCreateModal() {
  const ov = modal(`
    <h2>Create project</h2>
    <p class="sub">A project collects every pin your team pins on one site.</p>
    <label><span>Project name</span><input id="cp-name" placeholder="e.g. Marketing site review" /></label>
    <label><span>Site URL</span><input id="cp-url" type="url" placeholder="https://example.com" /></label>
    <p class="status" id="cp-status"></p>
    <div class="row">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn blue" id="cp-go">Create</button>
    </div>`);
  ov.querySelector("[data-close]").addEventListener("click", () => ov.remove());
  ov.querySelector("#cp-go").addEventListener("click", async () => {
    const name = ov.querySelector("#cp-name").value.trim();
    let url = ov.querySelector("#cp-url").value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;
    const st = ov.querySelector("#cp-status");
    if (!name) { st.textContent = "Name required."; st.className = "status err"; return; }
    st.textContent = "Creating…"; st.className = "status";
    try {
      const { project } = await api("/projects", { method: "POST", body: JSON.stringify({ name, url }) });
      projects.unshift({ ...project, counts: { active: 0, resolved: 0 } });
      ov.remove();
      location.hash = "#/p/" + project.id;
      renderSidebar();
    } catch (e) {
      if (e.message === "project_exists" && e.data?.project) {
        st.textContent = "You already have a project for this site. Opening it…";
        st.className = "status ok";
        setTimeout(() => {
          ov.remove();
          location.hash = "#/p/" + e.data.project.id;
        }, 900);
        return;
      }
      st.textContent = "Failed: " + e.message;
      st.className = "status err";
    }
  });
  setTimeout(() => ov.querySelector("#cp-name").focus(), 40);
}

function openShareModal() {
  const p = current.project;
  const shareUrl = location.origin + location.pathname + "#/p/" + p.id;
  const ov = modal(`
    <h2>Share "${esc(p.name)}"</h2>
    <p class="sub">Teammates get access to every pin in this project. They sign in with their own account.</p>
    <label><span>Invite by email (comma separated)</span><input id="sh-emails" placeholder="anna@team.com, erik@team.com" /></label>
    <p class="status" id="sh-status"></p>
    <div class="row">
      <button class="btn ghost" id="sh-copy">Copy project link</button>
      <button class="btn blue" id="sh-send">Invite</button>
    </div>
    <p class="sub" style="margin:14px 0 0">Members: <span id="sh-members">${esc([p.owner, ...(p.members || [])].join(", "))}</span></p>`);
  ov.querySelector("#sh-copy").addEventListener("click", async () => {
    await navigator.clipboard.writeText(shareUrl);
    const st = ov.querySelector("#sh-status");
    st.textContent = "Link copied."; st.className = "status ok";
  });
  ov.querySelector("#sh-send").addEventListener("click", async () => {
    const emails = ov.querySelector("#sh-emails").value.split(",").map((s) => s.trim()).filter(Boolean);
    const st = ov.querySelector("#sh-status");
    if (!emails.length) { st.textContent = "Enter at least one email."; st.className = "status err"; return; }
    st.textContent = "Inviting…"; st.className = "status";
    try {
      const { members, added } = await api(`/projects/${p.id}/invites`, { method: "POST", body: JSON.stringify({ emails }) });
      p.members = members;
      ov.querySelector("#sh-members").textContent = [p.owner, ...members].join(", ");
      st.textContent = added.length ? `Invited ${added.join(", ")}.` : "Already members.";
      st.className = "status ok";
    } catch (e) { st.textContent = "Failed: " + e.message; st.className = "status err"; }
  });
}

function openKebab(e) {
  const old = $("#kebab-menu"); if (old) { old.remove(); return; }
  const p = current.project;
  const menu = document.createElement("div");
  menu.className = "menu"; menu.id = "kebab-menu";
  const r = e.currentTarget.getBoundingClientRect();
  menu.style.top = r.bottom + 6 + "px";
  menu.style.right = (window.innerWidth - r.right) + "px";
  menu.innerHTML = `
    <button id="k-open">Open website</button>
    <button id="k-details">Project details</button>
    <button id="k-copy">Copy project link</button>
    <button id="k-export">Export project</button>
    <button id="k-archive">${p.archived ? "Unarchive" : "Archive"} project</button>
    <hr />
    <button class="danger" id="k-delete">Delete project</button>`;
  document.body.appendChild(menu);
  const dismiss = (ev) => { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener("click", dismiss, true); } };
  setTimeout(() => document.addEventListener("click", dismiss, true), 0);

  $("#k-open").addEventListener("click", () => {
    menu.remove();
    if (!p.url) { alertBanner("This project has no site URL yet."); return; }
    window.open(/^https?:/.test(p.url) ? p.url : "https://" + p.url, "_blank", "noopener");
  });
  $("#k-details").addEventListener("click", () => { menu.remove(); openDetailsModal(); });
  $("#k-export").addEventListener("click", () => { menu.remove(); location.hash = "#/p/" + p.id + "/export"; });
  $("#k-copy").addEventListener("click", async () => {
    menu.remove();
    await navigator.clipboard.writeText(location.origin + location.pathname + "#/p/" + p.id);
  });
  $("#k-archive").addEventListener("click", async () => {
    menu.remove();
    const { project } = await api("/projects/" + p.id, { method: "PATCH", body: JSON.stringify({ archived: !p.archived }) });
    Object.assign(p, project);
    renderProject();
  });
  $("#k-delete").addEventListener("click", async () => {
    menu.remove();
    if (!confirm(`Delete "${p.name}" and every pin in it? Cannot be undone.`)) return;
    await api("/projects/" + p.id, { method: "DELETE" });
    projects = projects.filter((x) => x.id !== p.id);
    location.hash = "";
    renderSidebar(); renderEmptyHome();
  });
}

function openDetailsModal() {
  const p = current.project;
  const isOwner = p.owner === session.email;
  const ov = modal(`
    <h2>Project details</h2>
    <p class="sub">${isOwner ? "Only the owner can change these." : "Read-only: you are a member, not the owner."}</p>
    <label><span>Project name</span><input id="pd-name" value="${esc(p.name)}" ${isOwner ? "" : "disabled"} /></label>
    <label><span>URL</span><input id="pd-url" value="${esc(p.url || "")}" placeholder="https://example.com" ${isOwner ? "" : "disabled"} /></label>
    <label><span>Description (optional)</span><textarea id="pd-desc" rows="3" placeholder="Description of the project" ${isOwner ? "" : "disabled"}>${esc(p.description || "")}</textarea></label>
    <p class="sub" style="margin:0">Owner ${esc(p.owner)} &middot; ${(p.members || []).length + 1} member${(p.members || []).length ? "s" : ""} &middot; ${current.pins.length} comment${current.pins.length === 1 ? "" : "s"}</p>
    <p class="status" id="pd-status"></p>
    <div class="row">
      <button class="btn ghost" data-close>${isOwner ? "Cancel" : "Close"}</button>
      ${isOwner ? `<button class="btn blue" id="pd-save">Save</button>` : ""}
    </div>`);
  ov.querySelector("[data-close]").addEventListener("click", () => ov.remove());
  const saveBtn = ov.querySelector("#pd-save");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const st = ov.querySelector("#pd-status");
    let url = ov.querySelector("#pd-url").value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;
    st.textContent = "Saving…"; st.className = "status";
    try {
      const { project } = await api("/projects/" + p.id, {
        method: "PATCH",
        body: JSON.stringify({
          name: ov.querySelector("#pd-name").value.trim(),
          url,
          description: ov.querySelector("#pd-desc").value.trim(),
        }),
      });
      Object.assign(p, project);
      const sp = projects.find((x) => x.id === p.id);
      if (sp) { sp.name = project.name; sp.url = project.url; }
      ov.remove();
      renderProject(); renderSidebar();
    } catch (e) { st.textContent = "Failed: " + e.message; st.className = "status err"; }
  });
}

function openPasswordModal() {
  const ov = modal(`
    <h2>Change password</h2>
    <label><span>Current password</span><input id="pw-old" type="password" autocomplete="current-password" /></label>
    <label><span>New password (8+ characters)</span><input id="pw-new" type="password" autocomplete="new-password" /></label>
    <p class="status" id="pw-status"></p>
    <div class="row">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn blue" id="pw-go">Update</button>
    </div>`);
  ov.querySelector("[data-close]").addEventListener("click", () => ov.remove());
  ov.querySelector("#pw-go").addEventListener("click", async () => {
    const st = ov.querySelector("#pw-status");
    const oldPassword = ov.querySelector("#pw-old").value;
    const newPassword = ov.querySelector("#pw-new").value;
    if (newPassword.length < 8) { st.textContent = "New password too short."; st.className = "status err"; return; }
    st.textContent = "Updating…"; st.className = "status";
    try {
      await api("/auth/change-password", { method: "POST", body: JSON.stringify({ oldPassword, newPassword }) });
      st.textContent = "Password updated."; st.className = "status ok";
      setTimeout(() => ov.remove(), 900);
    } catch (e) { st.textContent = "Failed: " + e.message; st.className = "status err"; }
  });
}

/* ── profile ── */
let profileTab = "personal";
let prefs = null;

async function renderProfile() {
  $("#main").innerHTML = `<div class="state"><div class="big">Loading…</div></div>`;
  try {
    const me = await api("/me");
    prefs = me.prefs || {};
    session.name = me.name || session.name;
  } catch { prefs = {}; }
  paintProfile();
  renderSidebar();
}

const PREF_ROWS = [
  ["mention", "Someone mentions me in a comment"],
  ["newComment", "New reply on a comment I created"],
  ["invited", "I am invited to a project"],
];

function paintProfile() {
  const tabs = [["personal", "Personal"], ["notifications", "Notifications"]];
  $("#main").innerHTML = `
    <div class="topbar"><div class="title"><h1>Profile</h1><div class="url">${esc(session.email)}</div></div></div>
    <div class="prof-tabs">
      ${tabs.map(([id, label]) => `<button class="prof-tab ${profileTab === id ? "on" : ""}" data-tab="${id}">${label}</button>`).join("")}
    </div>
    <div class="prof-body">
      ${profileTab === "personal" ? `
        <div class="prof-card">
          <h3>Personal</h3>
          <p class="sub">This name shows on your comments and mentions.</p>
          <label class="prof-field"><span>Display name</span><input id="pf-name" value="${esc(session.name || "")}" /></label>
          <label class="prof-field"><span>Email</span><input value="${esc(session.email)}" disabled /></label>
          <div class="row" style="justify-content:flex-start">
            <button class="btn blue" id="pf-save">Save</button>
            <span class="status" id="pf-status"></span>
          </div>
        </div>`
      : `
        <div class="prof-card">
          <h3>Notifications</h3>
          <p class="sub">Choose what Marko emails you about. In-app notifications always arrive.</p>
          <div class="prof-row prof-head"><span>Event</span><span style="flex:0 0 60px;text-align:right">Email</span></div>
          ${PREF_ROWS.map(([key, label]) => `
            <div class="prof-row">
              <span>${label}</span>
              <label class="sw"><input type="checkbox" data-pref="${key}" ${prefs[key] !== false ? "checked" : ""} /><i></i></label>
            </div>`).join("")}
          <p class="status" id="pf-nstatus"></p>
        </div>`}
    </div>`;

  document.querySelectorAll(".prof-tab").forEach((t) =>
    t.addEventListener("click", () => { profileTab = t.dataset.tab; paintProfile(); })
  );

  const save = $("#pf-save");
  if (save) save.addEventListener("click", async () => {
    const st = $("#pf-status");
    st.textContent = "Saving…"; st.className = "status";
    try {
      const me = await api("/me", { method: "PATCH", body: JSON.stringify({ name: $("#pf-name").value.trim() }) });
      session.name = me.name;
      localStorage.setItem(LS_KEY, JSON.stringify(session));
      st.textContent = "Saved."; st.className = "status ok";
      renderSidebar();
    } catch (e) { st.textContent = "Failed: " + e.message; st.className = "status err"; }
  });

  document.querySelectorAll("[data-pref]").forEach((el) =>
    el.addEventListener("change", async () => {
      const st = $("#pf-nstatus");
      prefs[el.dataset.pref] = el.checked;
      st.textContent = "Saving…"; st.className = "status";
      try {
        const me = await api("/me", { method: "PATCH", body: JSON.stringify({ prefs }) });
        prefs = me.prefs || prefs;
        st.textContent = "Saved."; st.className = "status ok";
      } catch (e) {
        el.checked = !el.checked;
        prefs[el.dataset.pref] = el.checked;
        st.textContent = "Failed: " + e.message; st.className = "status err";
      }
    })
  );
}

/* ── export view ── */
let exportOpts = {
  hideAuthor: false, hideDate: false,
  active: true, resolved: true,
  people: null,   // null = everyone
};

function exportedPins() {
  return current.pins.filter((h) => {
    const isResolved = h.status === "resolved";
    if (isResolved && !exportOpts.resolved) return false;
    if (!isResolved && !exportOpts.active) return false;
    if (exportOpts.people && !exportOpts.people.includes(h.createdBy)) return false;
    return true;
  });
}

async function renderExport(pid) {
  if (!current || current.project.id !== pid) {
    try { current = await api("/projects/" + pid); }
    catch { renderEmptyHome(); return; }
  }
  exportOpts.people = exportOpts.people ||
    [...new Set(current.pins.map((h) => h.createdBy))];
  paintExport();
  renderSidebar();
}

function paintExport() {
  const p = current.project;
  const list = exportedPins();
  let host = ""; try { host = new URL(p.url).host; } catch {}
  const dates = current.pins.map((h) => h.createdAt).filter(Boolean);
  const from = dates.length ? new Date(Math.min(...dates)) : null;
  const to = dates.length ? new Date(Math.max(...dates)) : null;
  const fmtD = (d) => d ? d.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" }) : "—";

  $("#main").innerHTML = `
    <div class="topbar no-print">
      <button class="btn ghost" id="ex-back">‹ Back to board</button>
      <div class="spacer"></div>
      <button class="kebab" id="ex-filters" title="Filters">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
      <button class="btn blue" id="ex-download">Export</button>
    </div>
    <div class="export-doc" id="export-doc">
      <h1 class="ex-title">${esc(p.name)}</h1>
      <p class="ex-host">${esc(host || p.url || "")}</p>
      <hr class="ex-rule" />
      <div class="ex-meta">
        <div>
          <span class="ex-label">Made by</span>
          <div class="ex-person"><span class="av">${esc(initials(p.owner))}</span>${esc(p.owner)}</div>
        </div>
        <div>
          <span class="ex-label">Severities</span>
          ${SEVERITIES.map((sv) => `<div class="ex-sev"><i style="background:${sv.color}"></i>${sv.label}</div>`).join("")}
        </div>
        <div>
          <span class="ex-label">Range of data</span>
          <div class="ex-line">From ${fmtD(from)}</div>
          <div class="ex-line">To ${fmtD(to)}</div>
        </div>
        <div>
          <span class="ex-label">Project description</span>
          <div class="ex-line">${esc(p.description || "No description")}</div>
        </div>
      </div>
      ${list.length ? list.map((h, i) => `
        <section class="ex-item">
          <div class="ex-item-body">
            <div class="ex-item-head">
              <span class="ex-num">${i + 1}</span>
              ${exportOpts.hideAuthor ? "" : `<span class="av sm">${esc(initials(h.createdBy))}</span><b>${esc((h.createdBy || "").split("@")[0])}</b>`}
            </div>
            <span class="ex-label">Note</span>
            <p class="ex-line">${esc(h.comment)}</p>
            <span class="ex-label">Severity</span>
            <div class="ex-sev"><i style="background:${(SEVERITIES.find((x) => x.id === severityOf(h)) || SEVERITIES[0]).color}"></i>${esc(severityOf(h))}</div>
            <span class="ex-label">Status</span>
            <p class="ex-line">${h.status === "resolved" ? "Resolved" : "Active"}</p>
            ${h.assignee ? `<span class="ex-label">Assigned to</span><p class="ex-line">${esc(h.assignee)}</p>` : ""}
            ${exportOpts.hideDate ? "" : `<span class="ex-label">Created</span><p class="ex-line">${new Date(h.createdAt).toLocaleString()}</p>`}
            ${h.device || h.viewport ? `<span class="ex-label">Device</span><p class="ex-line">${esc(h.device || "")} ${esc(h.viewport || "")}</p>` : ""}
            <span class="ex-label">Element</span>
            <p class="ex-line ex-code">${esc(h.selector || "—")}</p>
            ${(h.comments || []).length ? `<span class="ex-label">Replies (${h.comments.length})</span>
              ${h.comments.map((c) => `<p class="ex-line">${esc(c.byName || c.by)}: ${esc(c.text)}</p>`).join("")}` : ""}
          </div>
          <div class="ex-item-shot">
            ${h.hasShot ? `<img data-shot="${esc(h.id)}" alt="Screenshot for comment ${i + 1}" />` : `<div class="ex-noshot">No screenshot</div>`}
          </div>
        </section>`).join("")
      : `<p class="ex-line" style="padding:40px 0">Nothing matches the current filters.</p>`}
    </div>`;

  $("#ex-back").addEventListener("click", () => { location.hash = "#/p/" + p.id; });
  $("#ex-filters").addEventListener("click", openExportFilters);
  $("#ex-download").addEventListener("click", openExportModal);

  // pull screenshots in so they are present for print/PDF
  document.querySelectorAll("img[data-shot]").forEach((img) => {
    api(`/projects/${p.id}/pins/${img.dataset.shot}/shot`)
      .then((d) => { if (d.shot) img.src = d.shot; else img.closest(".ex-item-shot").innerHTML = '<div class="ex-noshot">No screenshot</div>'; })
      .catch(() => { img.closest(".ex-item-shot").innerHTML = '<div class="ex-noshot">No screenshot</div>'; });
  });
}

function openExportFilters() {
  const people = [...new Set(current.pins.map((h) => h.createdBy))];
  const ov = modal(`
    <h2>Filters</h2>
    <span class="sub">Export details</span>
    <label class="chk"><input type="checkbox" id="fx-author" ${exportOpts.hideAuthor ? "checked" : ""} /> Hide the name and avatar of the author</label>
    <label class="chk"><input type="checkbox" id="fx-date" ${exportOpts.hideDate ? "checked" : ""} /> Hide the creation date</label>
    <span class="sub" style="margin-top:14px">Comment status</span>
    <label class="chk"><input type="checkbox" id="fx-active" ${exportOpts.active ? "checked" : ""} /> Active</label>
    <label class="chk"><input type="checkbox" id="fx-resolved" ${exportOpts.resolved ? "checked" : ""} /> Resolved</label>
    <span class="sub" style="margin-top:14px">Authors (${people.length})</span>
    ${people.map((m, i) => `<label class="chk"><input type="checkbox" data-person="${esc(m)}" ${(!exportOpts.people || exportOpts.people.includes(m)) ? "checked" : ""} /> ${esc(m)}</label>`).join("")}
    <div class="row"><button class="btn blue" id="fx-done">Done</button></div>`);
  ov.querySelector("#fx-done").addEventListener("click", () => {
    exportOpts.hideAuthor = ov.querySelector("#fx-author").checked;
    exportOpts.hideDate = ov.querySelector("#fx-date").checked;
    exportOpts.active = ov.querySelector("#fx-active").checked;
    exportOpts.resolved = ov.querySelector("#fx-resolved").checked;
    exportOpts.people = [...ov.querySelectorAll("[data-person]")]
      .filter((c) => c.checked).map((c) => c.dataset.person);
    ov.remove();
    paintExport();
  });
}

function openExportModal() {
  const ov = modal(`
    <h2>Export project</h2>
    <label><span>Format</span>
      <select id="ex-format">
        <option value="pdf">PDF</option>
        <option value="csv">CSV</option>
      </select>
    </label>
    <div class="row">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn blue" id="ex-go">Export</button>
    </div>`);
  ov.querySelector("[data-close]").addEventListener("click", () => ov.remove());
  ov.querySelector("#ex-go").addEventListener("click", () => {
    const fmt = ov.querySelector("#ex-format").value;
    ov.remove();
    if (fmt === "pdf") { window.print(); return; }
    downloadCsv();
  });
}

function downloadCsv() {
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["#", "comment", "severity", "status", "author", "assignee", "created", "page", "selector", "replies"];
  const rows = exportedPins().map((h, i) => [
    i + 1, h.comment, severityOf(h), h.status || "active",
    exportOpts.hideAuthor ? "" : h.createdBy, h.assignee || "",
    exportOpts.hideDate ? "" : new Date(h.createdAt).toISOString(),
    h.pageUrl || "", h.selector || "",
    (h.comments || []).map((c) => `${c.byName || c.by}: ${c.text}`).join(" | "),
  ].map(cell).join(","));
  const blob = new Blob([[head.map(cell).join(","), ...rows].join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${current.project.name.replace(/[^\w.-]+/g, "-")}-comments.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ── routing + boot ── */
async function openProject(pid) {
  closeDrawer();
  $("#main").innerHTML = `<div class="state"><div class="big">Loading…</div></div>`;
  try {
    current = await api("/projects/" + pid);
    filters = { q: "", status: "active", assignee: "", author: "" };
    renderProject();
    // #/p/<pid>/h/<hid> comes from a mention: open that pin directly.
    const deep = location.hash.match(/^#\/p\/[a-zA-Z0-9_-]+\/h\/([a-zA-Z0-9_-]+)/);
    if (deep) {
      const target = current.pins.find((h) => h.id === deep[1]);
      // A resolved pin is filtered out of the default view, so widen it
      // rather than opening a drawer for a card that isn't on screen.
      if (target && target.status === "resolved") {
        filters.status = "all";
        renderProject();
      }
      if (target) openDrawer(deep[1]);
    }
  } catch {
    renderEmptyHome();
  }
  renderSidebar();
}

/* ── mentions inbox ── */
let mentions = [];

function fmtWhen(t) {
  const mins = Math.round((Date.now() - t) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  if (mins < 1440) return Math.round(mins / 60) + "h ago";
  return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

async function refreshMentionBadge() {
  try {
    const data = await api("/notifications");
    mentions = data.notifications || [];
    const badge = $("#mentions-badge");
    badge.textContent = data.unread ? String(data.unread) : "";
    badge.hidden = !data.unread;
  } catch {}
}

async function renderMentions() {
  $("#btn-mentions").classList.add("active");
  $("#main").innerHTML = `
    <div class="topbar">
      <div class="title"><h1>Mentions</h1><div class="url">Everywhere your name came up</div></div>
      <div class="spacer"></div>
      <button class="btn ghost" id="mark-all">Mark all read</button>
    </div>
    <div class="mention-list" id="mention-list"><p style="color:var(--muted)">Loading…</p></div>`;

  $("#mark-all").addEventListener("click", async () => {
    try {
      await api("/notifications", { method: "POST", body: JSON.stringify({ all: true }) });
      mentions = mentions.map((m) => ({ ...m, read: true }));
      await refreshMentionBadge();
      paintMentions();
    } catch {}
  });

  try {
    const data = await api("/notifications");
    mentions = data.notifications || [];
    const badge = $("#mentions-badge");
    badge.textContent = data.unread ? String(data.unread) : "";
    badge.hidden = !data.unread;
  } catch {
    mentions = [];
  }
  paintMentions();
}

function paintMentions() {
  const list = $("#mention-list");
  if (!list) return;
  if (!mentions.length) {
    list.innerHTML = `<div class="state"><div class="big">No mentions yet</div>
      <p>When a teammate writes @${esc((session.email || "").split("@")[0])} in a comment, it lands here.</p></div>`;
    return;
  }
  list.innerHTML = mentions.map((m) => `
    <button class="mention-item ${m.read ? "" : "unread"}" data-id="${esc(m.id)}"
            data-pid="${esc(m.projectId)}" data-hid="${esc(m.pinId)}">
      <span class="av">${esc(initials(m.byName || m.byEmail))}</span>
      <span class="body">
        <span class="who"><b>${esc(m.byName || m.byEmail)}</b> <span>mentioned you in ${esc(m.projectName)}</span></span>
        <span class="txt">${esc(m.text)}</span>
        <span class="when">${fmtWhen(m.at)}</span>
      </span>
    </button>`).join("");

  list.querySelectorAll(".mention-item").forEach((el) =>
    el.addEventListener("click", async () => {
      const { id, pid, hid } = el.dataset;
      try {
        await api("/notifications", { method: "POST", body: JSON.stringify({ ids: [id] }) });
        const hit = mentions.find((m) => m.id === id);
        if (hit) hit.read = true;
        await refreshMentionBadge();
      } catch {}
      location.hash = "#/p/" + pid + (hid ? "/h/" + hid : "");
    })
  );
}

async function route() {
  if (location.hash === "#/mentions") {
    current = null;
    renderSidebar();
    await renderMentions();
    return;
  }
  $("#btn-mentions").classList.remove("active");
  if (location.hash === "#/profile") { current = null; await renderProfile(); return; }
  const ex = location.hash.match(/^#\/p\/([a-zA-Z0-9_-]+)\/export/);
  if (ex) { await renderExport(ex[1]); return; }
  const pid = currentPid();
  if (pid) await openProject(pid);
  else { current = null; renderEmptyHome(); renderSidebar(); }
}

async function boot() {
  session = loadSession();
  if (!session) { location.href = "index.html#sign-in"; return; }
  $("#btn-create").addEventListener("click", openCreateModal);
  $("#sb-search").addEventListener("input", renderSidebar);
  $("#btn-account").addEventListener("click", () => { $("#acct-menu").hidden = !$("#acct-menu").hidden; });
  $("#mi-logout").addEventListener("click", logout);
  $("#mi-password").addEventListener("click", () => { $("#acct-menu").hidden = true; openPasswordModal(); });
  $("#mi-landing").addEventListener("click", () => { location.href = "index.html"; });
  $("#mi-settings").addEventListener("click", () => {
    $("#acct-menu").hidden = true;
    profileTab = "personal";
    location.hash = "#/profile";
  });
  $("#mi-install").addEventListener("click", () => {
    $("#acct-menu").hidden = true;
    window.open("https://github.com/strativ-dev/marko-site/releases/latest", "_blank", "noopener");
  });
  $("#btn-mentions").addEventListener("click", () => { location.hash = "#/mentions"; });
  refreshMentionBadge();
  window.addEventListener("hashchange", route);
  try {
    const data = await api("/projects");
    projects = data.projects;
  } catch (e) {
    if (e.message !== "unauthorized") $("#main").innerHTML = `<div class="state"><div class="big">Can't reach the backend</div><p>${esc(e.message)}</p></div>`;
    return;
  }
  await route();
}
boot();
