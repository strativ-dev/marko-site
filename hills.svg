<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 296 1600 324" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <!-- Distant ridges: hazy and desaturated so they read as far away. -->
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93bcae" stop-opacity=".6"/>
      <stop offset="1" stop-color="#b9d3ca" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="far2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fae9c" stop-opacity=".7"/>
      <stop offset="1" stop-color="#a6c8b8" stop-opacity=".45"/>
    </linearGradient>

    <!-- Main hill: sunlit crown rolling into a cool shaded flank. -->
    <linearGradient id="mid" x1=".15" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#9fc23c"/>
      <stop offset=".38" stop-color="#5f9a2e"/>
      <stop offset="1" stop-color="#1f5526"/>
    </linearGradient>
    <linearGradient id="midShade" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0" stop-color="#173f1e" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#1d4a24" stop-opacity=".18"/>
      <stop offset="1" stop-color="#1d4a24" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="right" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#b9d13f"/>
      <stop offset=".45" stop-color="#72ab30"/>
      <stop offset="1" stop-color="#2c6528"/>
    </linearGradient>

    <linearGradient id="near" x1=".3" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#7bb133"/>
      <stop offset=".45" stop-color="#519227"/>
      <stop offset="1" stop-color="#357520"/>
    </linearGradient>
    <linearGradient id="nearShade" x1="0" y1="0" x2=".85" y2=".4">
      <stop offset="0" stop-color="#19401f" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#1e4b25" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1e4b25" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="sun" cx="72%" cy="10%" r="75%">
      <stop offset="0" stop-color="#fff6c9" stop-opacity=".26"/>
      <stop offset=".45" stop-color="#f2f0a8" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="haze" x="-10%" y="-40%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softEdge" x="-5%" y="-20%" width="110%" height="150%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <!-- Foreground defocus, mimicking a shallow depth of field. -->
    <filter id="bokeh" x="-5%" y="-20%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>

    <pattern id="flowers" width="120" height="90" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="20" r="2.6" fill="#fff" opacity=".85"/>
      <circle cx="62" cy="10" r="2" fill="#fdfff0" opacity=".7"/>
      <circle cx="95" cy="34" r="2.9" fill="#fff" opacity=".8"/>
      <circle cx="38" cy="52" r="2.2" fill="#f7ffe8" opacity=".75"/>
      <circle cx="78" cy="70" r="2.7" fill="#fff" opacity=".8"/>
      <circle cx="8" cy="76" r="2.1" fill="#fffdf2" opacity=".65"/>
      <circle cx="112" cy="82" r="2.4" fill="#fff" opacity=".7"/>
    </pattern>
  </defs>

  <!-- Far ridge line: a thin hazy sliver at the very top of the band. -->
  <path filter="url(#haze)" fill="url(#far)"
        d="M0,330 C180,312 320,304 480,312 C650,320 780,336 950,330 C1120,324 1260,308 1420,314 C1500,317 1560,324 1600,328 L1600,620 L0,620 Z"/>
  <path filter="url(#haze)" fill="url(#far2)" opacity=".85"
        d="M0,348 C150,336 270,326 430,332 C600,338 700,354 880,350 C1060,346 1200,332 1380,338 C1470,341 1550,349 1600,353 L1600,620 L0,620 Z"/>

  <!-- Main rolling hill, crown just under the ridge line. -->
  <path filter="url(#softEdge)" fill="url(#mid)"
        d="M240,620 C240,620 280,430 500,372 C650,332 780,352 900,386 C1040,426 1180,418 1310,384 C1440,350 1540,354 1600,366 L1600,620 Z"/>
  <path filter="url(#softEdge)" fill="url(#midShade)"
        d="M240,620 C240,620 280,430 500,372 C600,346 690,352 770,372 C680,428 600,520 560,620 Z"/>

  <!-- Right hill catching the low sun. -->
  <path filter="url(#softEdge)" fill="url(#right)"
        d="M940,620 C980,478 1110,404 1270,394 C1400,386 1520,414 1600,440 L1600,620 Z"/>

  <!-- Left shoulder. -->
  <path filter="url(#softEdge)" fill="url(#mid)" opacity=".97"
        d="M0,404 C90,376 190,366 300,384 C272,452 240,540 228,620 L0,620 Z"/>

  <!-- Foreground meadow. -->
  <path fill="url(#near)"
        d="M0,500 C180,444 340,432 520,462 C700,492 860,556 1040,548 C1220,540 1400,496 1600,512 L1600,620 L0,620 Z"/>
  <path fill="url(#nearShade)"
        d="M0,500 C180,444 340,432 520,462 C640,482 740,520 850,538 C560,552 250,558 0,620 Z"/>

  <!-- Wildflowers, densest in the near field. -->
  <path fill="url(#flowers)" opacity=".6" filter="url(#bokeh)"
        d="M0,508 C180,452 340,440 520,470 C700,500 860,564 1040,556 C1220,548 1400,504 1600,520 L1600,620 L0,620 Z"/>

  <rect x="0" y="296" width="1600" height="324" fill="url(#sun)"/>
</svg>
