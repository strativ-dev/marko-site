<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your Marko password</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="marko-128.png?v=1.14.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #000;
      --text: #000;
      --sub: #3a3f49;
      --muted: #7b828e;
      --line: #e3e3e3;
      --card: #f6f7f9;
      --blue-mid: #0080ff;
      --blue-deep: #0099ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #78d2ff 0%, #0080ff 40%, #190096 100%);
      color: var(--text);
      font: 15px/1.55 "Inter", -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: #fff; border-radius: 22px;
      padding: 28px 26px;
      box-shadow: 0 30px 70px rgba(10, 14, 30, .35);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .brand img {
      width: 34px; height: 34px; border-radius: 9px; display: block;
      box-shadow: 0 0 0 1px rgba(0,0,0,.06);
    }
    .brand b { font-weight: 700; font-size: 16px; }
    h1 { font-size: 20px; font-weight: 700; margin: 4px 0 6px; letter-spacing: -0.02em; }
    p.sub { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
    label { display: block; margin-bottom: 12px; }
    label span { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 5px; font-weight: 500; }
    input {
      width: 100%; padding: 11px 14px; border: 1px solid var(--line);
      border-radius: 10px; font: 15px "Inter", sans-serif; color: var(--text);
      background: #fff; transition: border-color .12s, box-shadow .12s;
    }
    input:focus { outline: 0; border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(47,106,232,.18); }
    button {
      width: 100%; padding: 13px 18px; margin-top: 6px;
      background: var(--ink); color: #fff; border: 0; border-radius: 999px;
      font: 600 15px "Inter", sans-serif; cursor: pointer;
      transition: transform .12s, box-shadow .12s, opacity .12s;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0,0,0,.18); }
    button:disabled { opacity: .55; cursor: default; }
    .status { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--muted); }
    .status.err { color: #e5484d; }
    .status.ok { color: #22c55e; }
    .foot { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.5; text-align: center; }
    .foot a { color: var(--blue-mid); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="marko-128.png?v=1.14.0" alt="" /><b>Marko</b></div>
    <div id="form-wrap">
      <h1>Set a new password</h1>
      <p class="sub">Enter a new password for your Marko account. All existing sessions will be signed out.</p>
      <label><span>New password (8+ characters)</span><input id="pw1" type="password" autocomplete="new-password" /></label>
      <label><span>Confirm password</span><input id="pw2" type="password" autocomplete="new-password" /></label>
      <button id="submit">Set new password</button>
      <p class="status" id="status"></p>
    </div>
    <div id="done-wrap" hidden>
      <h1>Password updated</h1>
      <p class="sub">You can now sign in with your new password.</p>
      <a href="index.html#sign-in"><button type="button">Continue to sign in</button></a>
    </div>
    <p class="foot"><a href="index.html">Back to Marko</a></p>
  </div>
<script>
(() => {
  const BACKEND = "https://marko-share.strativ.workers.dev";
  const $ = (s) => document.querySelector(s);
  const pw1 = $("#pw1"), pw2 = $("#pw2");
  const submit = $("#submit"), status = $("#status");

  const token = (location.hash || "").replace(/^#/, "").split("&")
    .map((kv) => kv.split("="))
    .find((kv) => kv[0] === "token")?.[1];

  if (!token) {
    $("#form-wrap").innerHTML =
      '<h1>Invalid reset link</h1>' +
      '<p class="sub">This link is missing a token. Request a new one from the sign-in page.</p>';
  }

  function setStatus(msg, cls) {
    status.textContent = msg;
    status.className = "status" + (cls ? " " + cls : "");
  }
  function friendly(code) {
    return ({
      bad_token: "This reset link is invalid or expired. Request a new one.",
      password_too_short: "Password must be at least 8 characters.",
      worker_not_configured: "Backend is missing its signing key.",
    })[code] || code || "Something went wrong.";
  }

  [pw1, pw2].forEach((el) =>
    el && el.addEventListener("keydown", (e) => { if (e.key === "Enter") submit.click(); })
  );

  submit && submit.addEventListener("click", async () => {
    const a = pw1.value, b = pw2.value;
    if (a.length < 8) { setStatus("Password must be at least 8 characters.", "err"); return; }
    if (a !== b) { setStatus("Passwords don't match.", "err"); return; }
    submit.disabled = true;
    setStatus("Updating…", "");
    try {
      const res = await fetch(BACKEND + "/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: decodeURIComponent(token), newPassword: a }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ("http_" + res.status));
      $("#form-wrap").hidden = true;
      $("#done-wrap").hidden = false;
      history.replaceState(null, "", location.pathname);
    } catch (err) {
      setStatus(friendly(err.message), "err");
      submit.disabled = false;
    }
  });
})();
</script>
</body>
</html>
