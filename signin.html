<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Marko</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="marko-128.png?v=1.14.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Fragment+Mono&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    /* ── Design tokens — mirrored from index.html ─────────────────
       Kept name-for-name with the landing page so the two cannot drift
       apart silently. If a token changes there, change it here too. */
    :root {
      --violet: #190096;
      --blue: #0080ff;
      --blue-bright: #0099ff;
      --soft: #78d2ff;

      --sev-high: #e5484d;
      --sev-done: #22c55e;

      --ink: #06070b;
      --paper: #ffffff;
      --paper-2: #f4f6f8;

      --text: #06070b;
      --sub: #3d4354;
      --muted: #767d8f;
      --line: #e5e8ec;

      --display: "Inter Tight", "Inter", -apple-system, sans-serif;
      --body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --mono: "Fragment Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --r-sm: 8px;
      --r-md: 14px;
      --r-xl: 30px;
      --ease: cubic-bezier(.2, .6, .2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* setMode() toggles .hidden on rows, so this has to stay. */
    [hidden] { display: none !important; }
    html { overflow-x: clip; }
    body {
      min-height: 100vh;
      background: var(--ink);
      color: #fff;
      font: 15px/1.6 var(--body);
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }
    a { text-decoration: none; }
    :focus-visible { outline: 2px solid var(--blue-bright); outline-offset: 3px; border-radius: 4px; }

    /* ── The ink field, as on the landing hero ───────────────────── */
    /* Padding here is additive to the centred content, so an over-generous
       band forces a scrollbar that reveals nothing but empty space. The top
       only needs to clear the fixed nav (whose bottom edge sits at ~54px);
       the bottom only needs a gutter. */
    .page-wrap {
      position: relative; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 88px 20px 32px;
      overflow: hidden;
    }
    .field { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .field::before {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(58% 52% at 78% 8%, rgba(0,128,255,.34), transparent 68%),
        radial-gradient(52% 48% at 8% 88%, rgba(25,0,150,.55), transparent 70%),
        radial-gradient(40% 34% at 62% 78%, rgba(120,210,255,.14), transparent 72%);
    }
    .field::after {
      content: ""; position: absolute; inset: 0;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(70% 60% at 50% 45%, #000 30%, transparent 100%);
      mask-image: radial-gradient(70% 60% at 50% 45%, #000 30%, transparent 100%);
    }
    .page-wrap > *:not(.field):not(.rule) { position: relative; z-index: 2; }
    .rule {
      position: absolute; left: 0; right: 0; bottom: 0; height: 2px; z-index: 3;
      background: linear-gradient(90deg, var(--violet), var(--blue), var(--soft), var(--blue), var(--violet));
    }

    /* ── Nav — the landing page's glass capsule ──────────────────── */
    .navbar {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 100;
      width: min(920px, calc(100% - 24px));
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 8px 8px 8px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      color: #fff;
    }
    .brand { display: flex; align-items: center; gap: 9px; font: 700 14.5px var(--display); letter-spacing: -.02em; color: #fff; }
    .logo-chip { width: 24px; height: 24px; border-radius: 7px; display: block; }
    .nav-back {
      display: inline-flex; align-items: center; gap: 7px;
      background: #fff; color: var(--ink);
      padding: 9px 16px; border-radius: 999px;
      font: 600 13.5px var(--body);
      transition: background .2s var(--ease);
    }
    .nav-back:hover { background: #eef0f3; }

    /* ── Hero copy above the card ────────────────────────────────── */
    .si-eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      font: 11.5px/1 var(--mono);
      letter-spacing: .16em; text-transform: uppercase;
      color: rgba(255,255,255,.55);
      margin-bottom: 16px;
    }
    .si-eyebrow::before { content: ""; width: 18px; height: 1px; background: currentColor; opacity: .55; }
    .si-hero-title {
      font-family: var(--display);
      font-size: clamp(32px, 5.2vw, 54px);
      font-weight: 700; letter-spacing: -.045em; line-height: 1.02;
      color: #fff; text-align: center; margin-bottom: 28px;
    }
    /* setMode() injects this span, so it must stay a block-level payoff. */
    .serif {
      font-family: var(--serif); font-style: italic; font-weight: 400;
      display: block; letter-spacing: -.03em;
    }

    /* ── Card ────────────────────────────────────────────────────── */
    .si-card {
      width: min(420px, 100%);
      background: var(--paper);
      color: var(--text);
      border-radius: var(--r-xl);
      padding: 30px 28px 26px;
      box-shadow: 0 1px 2px rgba(0,0,0,.10), 0 28px 70px rgba(0,0,0,.45);
    }

    /* ── Tabs — the install section's segmented control ──────────── */
    .si-tabs {
      display: flex; gap: 4px; margin-bottom: 22px;
      background: var(--paper-2); padding: 4px; border-radius: 999px;
    }
    .si-tab {
      flex: 1; padding: 9px 12px; border: 0; background: transparent;
      border-radius: 999px; font: 600 13.5px var(--body); color: var(--muted);
      cursor: pointer;
      transition: background .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease);
    }
    .si-tab.active { background: var(--paper); color: var(--text); box-shadow: 0 2px 8px rgba(6,7,11,.1); }
    .si-tab:not(.active):hover { color: var(--sub); }

    /* ── Form ────────────────────────────────────────────────────── */
    .si-h2 {
      font-family: var(--display);
      font-size: 22px; font-weight: 700; letter-spacing: -.035em;
      color: var(--text); margin-bottom: 5px;
    }
    .si-sub { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 20px; }
    .si-field { display: block; margin-bottom: 12px; }
    .si-field span { display: block; font: 500 12.5px var(--body); color: var(--sub); margin-bottom: 6px; }
    .si-field input {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: var(--r-sm);
      font: 15px var(--body); color: var(--text); background: var(--paper);
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    }
    .si-field input:focus {
      outline: 0; border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,128,255,.15);
    }

    /* ── Buttons — the landing page's pill language ──────────────── */
    .si-submit {
      width: 100%; margin-top: 8px; padding: 14px 20px;
      background: var(--ink); color: #fff; border: 0; border-radius: 999px;
      font: 600 15px var(--body); letter-spacing: -.01em; cursor: pointer;
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), opacity .2s var(--ease);
    }
    .si-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(6,7,11,.24); }
    .si-submit:disabled { opacity: .45; cursor: default; }

    .si-google {
      width: 100%; margin-bottom: 16px; padding: 12px 20px;
      background: var(--paper); color: var(--text);
      border: 1.5px solid var(--line); border-radius: 999px;
      font: 600 14.5px var(--body); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform .25s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
    }
    .si-google:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--ink); }
    .si-google:disabled { opacity: .45; cursor: default; }

    .si-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 0 0 16px;
      font: 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    }
    .si-divider::before, .si-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    /* ── Status / footnotes ──────────────────────────────────────── */
    /* setStatus() rewrites className to "si-status [err|ok]". */
    .si-status { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--muted); }
    .si-status.err { color: var(--sev-high); }
    .si-status.ok { color: var(--sev-done); }
    .si-foot { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.55; }
    .si-foot a { color: var(--blue-bright); font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      .si-submit:hover:not(:disabled), .si-google:hover:not(:disabled) { transform: none; }
      .si-submit, .si-google, .si-tab, .si-field input { transition: none; }
    }
    /* Short windows: the card is ~608px and non-negotiable, so the hero copy
       gives way instead — kicker out, payoff back inline, smaller type. That
       buys ~110px, which covers the common 760-820px laptop viewports. Below
       ~700px the content genuinely exceeds the window and scrolling is right. */
    @media (max-height: 820px) {
      .si-eyebrow { display: none; }
      .si-hero-title { font-size: clamp(26px, 3.4vw, 34px); margin-bottom: 20px; }
      .si-hero-title .serif { display: inline; }
      .page-wrap { padding: 78px 20px 26px; }
    }
    /* 1366x768 laptops land at ~760 usable; 8px was all that stood between
       them and a scrollbar. */
    @media (max-height: 780px) {
      .page-wrap { padding: 72px 20px 20px; }
      .si-hero-title { margin-bottom: 16px; }
    }
    @media (max-width: 560px) {
      .page-wrap { padding: 80px 18px 28px; }
      .si-card { padding: 26px 22px 22px; }
      .navbar { padding: 8px 8px 8px 14px; }
      .nav-back { padding: 8px 13px; font-size: 12.5px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a class="brand" href="index.html">
    <img class="logo-chip" src="marko-128.png?v=1.14.0" alt="" />
    Marko
  </a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    Back to home
  </a>
</nav>

<div class="page-wrap">

  <div class="field" aria-hidden="true"></div>

  <p class="si-eyebrow">Your account</p>
  <h1 class="si-hero-title" id="si-hero-title">
    Welcome back.
    <span class="serif">Let's review.</span>
  </h1>

  <div class="si-card" role="main" aria-labelledby="si-title">
    <div class="si-tabs" role="tablist">
      <button class="si-tab active" data-mode="login" role="tab">Sign in</button>
      <button class="si-tab" data-mode="signup" role="tab">Create account</button>
    </div>
    <h2 class="si-h2" id="si-title">Welcome back</h2>
    <p class="si-sub" id="si-sub">New here? Just sign in — we'll create your account.</p>
    <div id="si-google-row">
      <button class="si-google" id="si-google" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.63h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.8Z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.9l-3.88-3a7.4 7.4 0 0 1-11-3.9H1.06v3.09A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.06 14.2a7.2 7.2 0 0 1 0-4.4V6.71H1.06a12 12 0 0 0 0 10.58l4-3.09Z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.35.6 4.6 1.79l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.06 6.71l4 3.09A7.16 7.16 0 0 1 12 4.75Z"/></svg>
        Continue with Google
      </button>
      <div class="si-divider"><span>or</span></div>
    </div>
    <label class="si-field"><span>Email</span><input id="si-email" type="email" autocomplete="email" /></label>
    <label class="si-field" id="si-pw-field"><span id="si-pw-label">Password (8+ characters)</span><input id="si-password" type="password" autocomplete="new-password" /></label>
    <button class="si-submit" id="si-submit">Create account</button>
    <p class="si-status" id="si-status"></p>
    <p class="si-foot" id="si-forgot-row" hidden style="text-align:right;margin-top:8px;">
      <a href="#" id="si-forgot">Forgot password?</a>
    </p>
    <p class="si-foot" id="si-back-row" hidden style="text-align:right;margin-top:8px;">
      <a href="#" id="si-back">&larr; Back to sign in</a>
    </p>
    <p class="si-foot">
      Sign-in opens Marko in your Chrome extension. Don't have it yet?
      <a href="index.html#install">Install Marko first.</a>
    </p>
  </div>

  <div class="rule" aria-hidden="true"></div>
</div>

<script src="vendor/supabase.js"></script>
<script src="marko-web.js"></script>
<script>
(() => {
  const EXT_ID = "jhnnkjnpggliikhiiceijlkclhlblgjf";
  const CALLBACK = "chrome-extension://" + EXT_ID + "/auth/callback.html";
  const sb = window.marko && window.marko.supabase;

  const $ = (s) => document.querySelector(s);
  const email = $("#si-email");
  const pw = $("#si-password");
  const submit = $("#si-submit");
  const status = $("#si-status");
  const title = $("#si-title");
  const sub = $("#si-sub");
  const pwLabel = $("#si-pw-label");
  let mode = "login";

  const tabsRow = document.querySelector(".si-tabs");
  const heroTitle = $("#si-hero-title");
  const pwField = $("#si-pw-field");
  const forgotRow = $("#si-forgot-row");
  const backRow = $("#si-back-row");
  const googleRow = $("#si-google-row");
  const googleBtn = $("#si-google");

  function setMode(next) {
    mode = next;
    document.querySelectorAll(".si-tab").forEach((t) =>
      t.classList.toggle("active", t.dataset.mode === (mode === "forgot" ? "login" : mode))
    );
    if (mode === "signup") {
      tabsRow.hidden = false;
      pwField.hidden = false;
      backRow.hidden = true;
      googleRow.hidden = false;
      heroTitle.innerHTML = 'Welcome. <span class="serif">Let\'s get started.</span>';
      title.textContent = "Create your account";
      sub.textContent = "Free forever. Nothing to install on your server.";
      pwLabel.textContent = "Password (8+ characters)";
      pw.setAttribute("autocomplete", "new-password");
      submit.textContent = "Create account";
      forgotRow.hidden = true;
    } else if (mode === "login") {
      tabsRow.hidden = false;
      pwField.hidden = false;
      backRow.hidden = true;
      googleRow.hidden = false;
      heroTitle.innerHTML = 'Welcome back. <span class="serif">Let\'s review.</span>';
      title.textContent = "Welcome back";
      sub.textContent = "New here? Just sign in — we'll create your account.";
      pwLabel.textContent = "Password (8+ characters)";
      pw.setAttribute("autocomplete", "current-password");
      submit.textContent = "Sign in";
      forgotRow.hidden = false;
    } else {
      // "forgot" — collect email only, hide password field + tabs + Google.
      tabsRow.hidden = true;
      pwField.hidden = true;
      forgotRow.hidden = true;
      backRow.hidden = false;
      googleRow.hidden = true;
      title.textContent = "Reset your password";
      sub.textContent = "We'll email you a link to set a new one.";
      submit.textContent = "Send reset link";
    }
    submit.disabled = false;
    setStatus("", "");
  }
  function setStatus(msg, cls) {
    status.textContent = msg;
    status.className = "si-status" + (cls ? " " + cls : "");
  }
  function friendly(msg) {
    const m = String(msg || "").toLowerCase();
    if (m.includes("invalid login")) return "Wrong email or password.";
    if (m.includes("already registered") || m.includes("already been registered"))
      return "An account with that email already exists.";
    if (m.includes("email")) return "That doesn't look like a valid email.";
    if (m.includes("password")) return "Password must be at least 8 characters.";
    return msg || "Something went wrong.";
  }

  // Bridge a signed-in Supabase session into the extension via its
  // web-accessible callback page in a hidden iframe. Fails silently when the
  // extension isn't installed.
  let lastBridgedToken = "";
  function bridgeToExtension(session, name) {
    if (!session) return;
    if (session.access_token === lastBridgedToken) return;
    lastBridgedToken = session.access_token;
    const meta = session.user.user_metadata || {};
    const avatar = meta.avatar_url || meta.picture || "";
    // postMessage bridge — works on Firefox/Zen where chrome-extension:// URL fails.
    window.postMessage({
      type: "marko-bridge",
      at: session.access_token, rt: session.refresh_token,
      exp: (session.expires_at || 0) * 1000,
      email: session.user.email, name: name || "", avatar,
    }, "*");
    // iframe bridge — Chrome.
    const frame = document.createElement("iframe");
    frame.style.display = "none";
    frame.src = CALLBACK + "#" +
      "at=" + encodeURIComponent(session.access_token) +
      "&rt=" + encodeURIComponent(session.refresh_token) +
      "&exp=" + encodeURIComponent(String((session.expires_at || 0) * 1000)) +
      "&email=" + encodeURIComponent(session.user.email) +
      "&name=" + encodeURIComponent(name || "") +
      "&avatar=" + encodeURIComponent(avatar);
    const drop = () => frame.remove();
    frame.addEventListener("load", () => setTimeout(drop, 1000));
    setTimeout(drop, 10000); // extension not installed: load never fires
    document.body.appendChild(frame);
  }

  document.querySelectorAll(".si-tab").forEach((t) =>
    t.addEventListener("click", () => setMode(t.dataset.mode))
  );
  $("#si-forgot").addEventListener("click", (e) => { e.preventDefault(); setMode("forgot"); });
  $("#si-back").addEventListener("click", (e) => { e.preventDefault(); setMode("login"); });
  googleBtn.addEventListener("click", async () => {
    if (!sb) { setStatus("Auth failed to initialise. Reload the page.", "err"); return; }
    googleBtn.disabled = true;
    setStatus("Redirecting to Google…", "");
    // scopes is deliberately just "email profile" — that's what gets us the
    // address + avatar picture. No Drive/Calendar/Contacts/etc are requested.
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: location.origin + location.pathname,
        scopes: "email profile",
        queryParams: { prompt: "select_account" },
      },
    });
    if (error) { setStatus(friendly(error.message), "err"); googleBtn.disabled = false; }
    // On success the browser navigates to Google, so nothing else to do here.
  });
  [email, pw].forEach((el) =>
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") submit.click(); })
  );

  submit.addEventListener("click", async () => {
    const e = email.value.trim().toLowerCase();
    if (!sb) { setStatus("Auth failed to initialise. Reload the page.", "err"); return; }

    if (mode === "forgot") {
      if (!e) { setStatus("Enter your email.", "err"); return; }
      submit.disabled = true;
      setStatus("Sending…", "");
      // Supabase always resolves without revealing whether the address exists.
      await sb.auth.resetPasswordForEmail(e, {
        redirectTo: new URL("reset.html", location.href).href,
      });
      setStatus("If that email is registered, a reset link is on its way. Check your inbox.", "ok");
      return;
    }

    const p = pw.value;
    if (!e || !p) { setStatus("Enter email and password.", "err"); return; }
    if (mode === "signup" && p.length < 8) {
      setStatus("Password must be at least 8 characters.", "err"); return;
    }
    submit.disabled = true;
    setStatus(mode === "signup" ? "Creating account…" : "Signing in…", "");
    try {
      const name = e.split("@")[0] || "";
      let session;
      if (mode === "signup") {
        const { data, error } = await sb.auth.signUp({
          email: e, password: p, options: { data: { name } },
        });
        if (error) throw error;
        session = data.session;
        // Email-confirmation enabled: no session until they confirm.
        if (!session) {
          setStatus("Account created. Check your inbox to confirm, then sign in.", "ok");
          submit.disabled = false;
          return;
        }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email: e, password: p });
        if (!error) {
          session = data.session;
        } else if (/invalid login/i.test(error.message)) {
          // Unknown email → create the account on the fly (per product choice:
          // never block a new email at sign-in). A known email with the wrong
          // password comes back "already registered", which we surface instead.
          if (p.length < 8) { setStatus("Password must be at least 8 characters.", "err"); submit.disabled = false; return; }
          const up = await sb.auth.signUp({ email: e, password: p, options: { data: { name } } });
          if (up.error) {
            if (/registered/i.test(up.error.message)) throw new Error("invalid login credentials");
            throw up.error;
          }
          session = up.data.session;
          if (!session) {
            setStatus("Account created. Check your inbox to confirm, then sign in.", "ok");
            submit.disabled = false;
            return;
          }
        } else {
          throw error;
        }
      }

      bridgeToExtension(session, (session.user.user_metadata || {}).name || name);
      setStatus("Signed in. Opening your projects…", "ok");
      setTimeout(() => { window.location.href = "app.html"; }, 900);
    } catch (err) {
      setStatus(friendly(err.message), "err");
      submit.disabled = false;
    }
  });

  async function checkExistingSession() {
    if (!sb) return;
    const { data } = await sb.auth.getSession();
    if (data.session) { window.location.href = "app.html"; }
  }

  setMode("login");
  checkExistingSession();
  // SIGNED_IN only fires on an actual new sign-in (password submit already
  // handles its own redirect above; this is what catches the browser landing
  // back here after the Google OAuth round trip, where there's no submit
  // handler to hook).
  if (sb) {
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" && session) {
        const name = (session.user.user_metadata || {}).name || (session.user.user_metadata || {}).full_name || "";
        bridgeToExtension(session, name);
        // Wait for the extension bridge iframe to confirm it stored the session
        // before navigating. The iframe posts "marko-auth-ok" when done.
        // Fall back after 2 s so navigation still happens if the extension is
        // not installed (the iframe load would fail silently).
        const go = () => { window.location.href = "app.html"; };
        const handler = (e) => {
          if (e.data && e.data.type === "marko-auth-ok") {
            window.removeEventListener("message", handler);
            clearTimeout(fallback);
            go();
          }
        };
        window.addEventListener("message", handler);
        const fallback = setTimeout(() => {
          window.removeEventListener("message", handler);
          go();
        }, 2000);
      }
    });
  }
})();
</script>
